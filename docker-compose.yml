services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      CI_ENV: development
      DB_HOST: db
      DB_USERNAME: root
      DB_PASSWORD: secret
      DB_DATABASE: app
      DB_DRIVER: mysqli
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./application/logs:/var/www/html/application/logs
      - ./application/cache:/var/www/html/application/cache

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: app
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: secret
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  db_data:
