name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: app
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring
          coverage: none
          tools: composer

      - name: Lint all PHP files
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      # --no-dev: the smoke test only boots the app, which needs the runtime
      # packages (phpdotenv, monolog) — all of which support PHP 8.1. The dev
      # tooling in composer.lock (php-cs-fixer -> symfony 7.4) needs PHP >= 8.2
      # and would make this job fail on 8.1; quality/test run on 8.3.
      - name: Install composer dependencies
        run: composer install --no-dev --no-progress --prefer-dist --optimize-autoloader

      - name: Set up local config
        run: |
          cp application/config/database.php.example application/config/database.php
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_USERNAME=root" >> .env
          echo "DB_DATABASE=app" >> .env

      - name: Run migrations and seeders
        run: |
          php index.php console migrate
          php index.php console seed

      - name: Boot the app and smoke test routes
        run: |
          php -S 127.0.0.1:8080 -t . index.php &
          SERVER_PID=$!
          sleep 1

          check() {
            path="$1"
            body="$(curl -s -w '\n%{http_code}' "http://127.0.0.1:8080/$path")"
            code="$(echo "$body" | tail -n1)"
            content="$(echo "$body" | sed '$d')"
            if [ "$code" != "200" ]; then
              echo "FAIL: /$path returned HTTP $code"
              exit 1
            fi
            if echo "$content" | grep -q "PHP Error was encountered\|uncaught Exception"; then
              echo "FAIL: /$path rendered a PHP error/exception:"
              echo "$content"
              exit 1
            fi
            echo "OK: /$path"
          }

          check ""
          check "example"
          check "health"
          check "login"
          check "register"

          kill $SERVER_PID

      # The installer on a brand new MySQL database: it must create the database,
      # run every migration, create the administrator, sign them in and then lock itself.
      - name: One-click installer on a fresh database
        run: |
          export DB_DATABASE=fresh_install
          php -S 127.0.0.1:8082 -t . index.php &
          SERVER_PID=$!
          sleep 1
          jar="$(mktemp)"
          fail() { echo "FAIL: $1"; kill $SERVER_PID; exit 1; }

          page="$(curl -s -c "$jar" -b "$jar" http://127.0.0.1:8082/install)"
          echo "$page" | grep -q 'Install now' || fail "the installer form is not shown"
          echo "$page" | grep -q 'does not exist yet' || fail "the missing database is not announced"
          token="$(echo "$page" | grep -o 'name="csrf_token" value="[^"]*"' | head -1 | sed 's/.*value="\([^"]*\)"/\1/')"
          [ -n "$token" ] || fail "no CSRF token in the form"

          code="$(curl -s -o /dev/null -w '%{http_code}' -c "$jar" -b "$jar" \
            --data-urlencode "csrf_token=$token" --data-urlencode "app_name=CI App" \
            --data-urlencode "admin_name=CI Admin" --data-urlencode "admin_email=ci@example.com" \
            --data-urlencode "admin_password=correct-horse-1" --data-urlencode "admin_password_confirm=correct-horse-1" \
            http://127.0.0.1:8082/install)"
          # CodeIgniter answers a redirect with 302, 303 (after a POST) or 307 (after a GET), depending on the HTTP version.
          case "$code" in 302|303|307) ;; *) fail "installing returned HTTP $code instead of a redirect" ;; esac

          dashboard="$(curl -s -c "$jar" -b "$jar" http://127.0.0.1:8082/dashboard)"
          echo "$dashboard" | grep -q 'CI Admin' || fail "not signed in as the new administrator"
          echo "$dashboard" | grep -q 'CI App' || fail "the application name was not saved"

          code="$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" http://127.0.0.1:8082/install)"
          case "$code" in 302|303|307) ;; *) fail "the installer is still open after installing (HTTP $code)" ;; esac

          mysql -h127.0.0.1 -uroot -e 'SHOW TABLES' fresh_install | grep -qx 'users' || fail "the users table does not exist"
          echo "OK: installer"
          kill $SERVER_PID

  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Install composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: PHPStan
        run: composer analyze -- --error-format=github

      - name: PHP-CS-Fixer (dry run)
        run: composer cs-check

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Install composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: PHPUnit
        run: composer test
