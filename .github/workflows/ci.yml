name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring
          coverage: none

      - name: Lint all PHP files
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Set up local config
        run: cp application/config/database.php.example application/config/database.php

      - name: Boot the app and smoke test routes
        run: |
          php -S 127.0.0.1:8080 -t . index.php &
          SERVER_PID=$!
          sleep 1

          check() {
            path="$1"
            body="$(curl -s -w '\n%{http_code}' "http://127.0.0.1:8080/$path")"
            code="$(echo "$body" | tail -n1)"
            content="$(echo "$body" | sed '$d')"
            if [ "$code" != "200" ]; then
              echo "FAIL: /$path returned HTTP $code"
              exit 1
            fi
            if echo "$content" | grep -q "PHP Error was encountered\|uncaught Exception"; then
              echo "FAIL: /$path rendered a PHP error/exception:"
              echo "$content"
              exit 1
            fi
            echo "OK: /$path"
          }

          check ""
          check "example"

          kill $SERVER_PID
